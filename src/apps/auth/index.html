<html>
  <head>
    <title>Stylebot</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="color-scheme" content="light dark" />

    <style>
      body {
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        box-sizing: border-box;
        font: 18px/1.4 system-ui, sans-serif;
        color: #52525b;
        text-align: center;
      }

      img {
        width: 48px;
        height: 48px;
      }

      p {
        margin: 0;
        max-width: 32rem;
      }

      #detail {
        font-size: 15px;
        color: #71717a;
      }

      button {
        font: inherit;
        font-size: 14px;
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }

      [hidden] {
        display: none;
      }

      @media (prefers-color-scheme: dark) {
        body {
          color: #e4e4e7;
        }

        #detail {
          color: #a1a1aa;
        }
      }
    </style>
  </head>

  <body>
    <img src="../img/icon128.png" alt="" />
    <p id="status" role="status" aria-live="polite"></p>
    <p id="detail" hidden></p>
    <button id="close" type="button" hidden></button>

    <script type="text/javascript" src="index.js"></script>
  </body>
</html>
